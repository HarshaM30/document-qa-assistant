[project]
name = "docqa"
version = "0.1.0"
description = "Document Q&A over SEC 10-K filings and uploaded PDFs: retrieval-augmented, cited, and evaluated."
authors = [
    { name = "Harshavardhan Maddi", email = "129699262+HarshaM30@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "email-validator>=2.4.0",
    "fastapi>=0.163.1",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "langchain-core>=1.8.1",
    "litellm>=1.109.1",
    "lxml>=6.1.3",
    "pdfplumber>=0.11.10",
    "pgvector>=0.5.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0.3",
    "redis>=5.3.1",
    "sqlalchemy[asyncio]>=2.1.9",
    "typer>=0.29.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
docqa = "docqa.cli:app"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF", "N", "C4", "PT"]
ignore = [
    "B008",   # FastAPI Depends() in argument defaults is idiomatic
    "RUF012", # SQLAlchemy / pydantic class attributes
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src/docqa", "tests"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["arq.*", "pgvector.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: needs Postgres and Redis",
]
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    # arq's own Worker.close() still calls the deprecated redis close().
    "ignore:Call to deprecated close:DeprecationWarning:arq.worker",
    # litellm's own TypedDicts trip a pydantic notice on import.
    "ignore:Items? .* (is|are) using the `ReadOnly` qualifier:UserWarning",
]
